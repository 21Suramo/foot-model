name: weekly-sync

on:
  schedule:
    # Lundi 06:00 UTC : met à jour la base et clôture les matchs de la
    # semaine précédente avant la génération manuelle des prédictions
    # de la semaine (routine documentée dans CLAUDE.md).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  # issues: write requis par l'étape "Alerter si aucun commit..." ci-dessous
  # (gh issue create/comment) — trouvé absent en auditant odds_snapshot.yml
  # (2026-09-22) : déclarer `permissions:` du tout restreint tout scope non
  # listé à `none`, donc cette alerte échouait en 403 sans jamais avoir été
  # testée en conditions réelles (pas encore déclenchée depuis son ajout du
  # 2026-09-21).
  issues: write

# Groupe PARTAGÉ avec odds-snapshot.yml (même nom exact) : les deux workflows
# committent data/football.db, GitHub Actions sérialise donc leurs runs entre
# eux (jamais deux push concurrents sur ce fichier), quel que soit celui qui
# a déclenché en premier. cancel-in-progress: false — un run en cours
# représente une vraie capture de données, jamais du travail jetable qu'on
# voudrait annuler au profit du suivant.
concurrency:
  group: football-db-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # continue-on-error : audit du 2026-09-21, pipeline.py --update peut
      # désormais sortir en échec (garde anti-stagnation, cf. pipeline.py) si
      # MAX(date) n'avance pas pour la saison en cours alors que des matchs
      # ont eu lieu il y a plus de 5 jours. On laisse quand même tourner
      # sync-results/report/commit sur ce que le pipeline a pu avancer avant
      # de détecter le problème ; le job échoue explicitement à la toute fin
      # (étape "Refléter l'échec du pipeline") pour ne pas cacher le signal
      # derrière un badge vert.
      - name: Mettre à jour la base (football-data + Understat)
        id: pipeline
        continue-on-error: true
        run: python pipeline.py --update

      - name: Clôturer les résultats de la semaine précédente
        run: python predict.py sync-results

      - name: Rapport de calibration
        run: python predict.py report

      - name: Archiver football.db + le journal (backup secondaire)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backup
          path: |
            data/football.db
            data/production_journal.json
          retention-days: 90

      # Bug corrigé le 2026-09-21 (audit) : cette étape ne committait
      # jusqu'ici QUE production_journal.json/production_calibration.md —
      # jamais data/football.db. pipeline.py --update avançait donc bien la
      # base dans le checkout éphémère de CHAQUE run, mais ce progrès était
      # perdu à la fin du job : le football.db committé dans le repo ne
      # bougeait jamais via cette automatisation (seuls des runs manuels
      # avaient fait avancer les dates réellement committées). data/football.db
      # est explicitement suivi (exception dans .gitignore, déjà committé par
      # odds-snapshot.yml) : rien n'empêchait de l'ajouter ici, l'oubli était
      # la seule cause.
      - name: Committer si la base, le journal ou le rapport ont changé
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/football.db data/production_journal.json reports/production_calibration.md; then
            echo "Rien à committer."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/football.db data/production_journal.json reports/production_calibration.md
          git commit -m "weekly-sync : mise à jour base + clôture résultats + rapport calibration"

          # odds-snapshot.yml committe aussi data/football.db. Le groupe de
          # concurrency ci-dessus sérialise déjà les deux workflows entre
          # eux, mais ne protège pas contre un push manuel ou un autre
          # déclencheur entretemps — filet de sécurité : pull --rebase avant
          # chaque nouvel essai de push, jusqu'à 5 fois avec backoff. Un
          # rebase propre (l'autre commit ne touchait pas nos lignes) suffit
          # à retenter directement ; un CONFLIT de rebase sur data/football.db
          # (fichier SQLite binaire, jamais fusionnable ligne à ligne) ne se
          # résout pas en éditant le diff — on abandonne le rebase, on
          # repart de zéro sur le HEAD distant (reset --hard), puis on rejoue
          # le calcul qui a produit nos changements (pipeline.py --update est
          # un upsert idempotent : le rejouer sur la base déjà avancée par
          # l'autre run ne fait que compléter ce qui manque encore) avant de
          # recommitter.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "::error::push échoué après 5 tentatives (conflit persistant sur data/football.db)."
              exit 1
            fi
            echo "push échoué (tentative $attempt/5)..."
            sleep $((attempt * 5))
            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              echo "rebase propre — nouvel essai de push."
            else
              echo "conflit de rebase — abandon, reset sur origin/$GITHUB_REF_NAME, rejeu de pipeline.py --update."
              git rebase --abort || true
              git reset --hard "origin/$GITHUB_REF_NAME"
              python pipeline.py --update || true
              if git diff --quiet -- data/football.db data/production_journal.json reports/production_calibration.md; then
                echo "Plus rien à committer après resynchronisation (déjà couvert par l'autre run)."
                echo "committed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git add data/football.db data/production_journal.json reports/production_calibration.md
              git commit -m "weekly-sync : mise à jour base + clôture résultats + rapport calibration"
            fi
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Échec silencieux constaté le 2026-09-21 : un run peut réussir sans
      # rien avancer (source sans nouvelle donnée, ou régression du pipeline)
      # et ça ne se voyait nulle part. Ouvre une issue (ou commente celle déjà
      # ouverte) plutôt que de laisser ce silence invisible d'un lundi à
      # l'autre. Ne bloque jamais sur un label qui n'existerait pas dans le
      # repo (aucun --label).
      - name: Alerter si aucun commit n'a été produit
        if: steps.commit.outputs.committed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="weekly-sync : aucun commit produit"
          BODY="Run $(date -u +%Y-%m-%dT%H:%M:%SZ) — pipeline.py --update + sync-results + report n'ont produit AUCUN changement committable (football.db, journal et rapport identiques après le run). Soit football-data.co.uk n'a rien de nouveau à publier pour la saison en cours, soit le pipeline ne progresse plus — vérifier les logs : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Refléter l'échec du pipeline (garde anti-stagnation)
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::pipeline.py --update a détecté une stagnation (MAX(date) n'a pas avancé alors que des matchs ont eu lieu il y a plus de 5 jours) — voir le log de l'étape 'Mettre à jour la base'."
          exit 1
