name: odds-snapshot

on:
  schedule:
    # Roadmap A2, décision du 2026-09-13 : Option A (free tier), 2 captures/jour
    # (matin + soir), markets=h2h/regions=eu uniquement (le moins coûteux) —
    # 2 x 3 crédits/jour = ~180 crédits/mois sur les 500 du free tier, marge
    # gardée pour les tests manuels. Voir CLAUDE.md ("Cadence de capture des
    # cotes") avant de changer ce cron ou les marchés/régions demandés :
    # au-delà de ~2/jour on dépasse le budget gratuit (cf. odds_snapshot.py).
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Groupe PARTAGÉ avec weekly.yml (même nom exact, voir ce fichier pour le
# détail) : les deux committent data/football.db, sérialisés entre eux
# plutôt que de risquer un push concurrent sur ce fichier.
concurrency:
  group: football-db-writers
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Capturer un snapshot de cotes (h2h/eu — cf. budget de crédits)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds_snapshot.py --markets h2h --regions eu

      # La récupération sur conflit de rebase (data/football.db, binaire,
      # jamais fusionnable ligne à ligne) vit dans
      # scripts/push_with_recovery.sh, partagée avec weekly.yml et testée
      # par tests/test_workflows.py::TestPushWithRecoveryScript. Le rejeu
      # (book_odds est une série temporelle en INSERT OR IGNORE : rejouer la
      # capture sur la base déjà avancée par l'autre run est sûr, au pire
      # coût d'un appel API en plus) a besoin d'ODDS_API_KEY comme la
      # capture initiale.
      - name: Committer si de nouvelles lignes sont apparues dans book_odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/push_with_recovery.sh \
            "odds-snapshot : nouveau snapshot book_odds ($timestamp)" \
            "python odds_snapshot.py --markets h2h --regions eu" \
            data/football.db
